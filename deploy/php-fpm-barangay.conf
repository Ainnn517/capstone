; PHP-FPM pool for the Barangay Reporting System (/etc/php/8.3/fpm/pool.d/barangay.conf).
; Runs as its own system user, so the web app cannot read anything in /home.
[barangay]
user = barangay
group = barangay

listen = /run/php/barangay.sock
listen.owner = barangay
listen.group = caddy
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 120s

; Only .php files run as PHP.
security.limit_extensions = .php

; Programs the app runs (ffmpeg for video clean-up).
clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/barangay/app/storage/logs/php-fpm-errors.log
