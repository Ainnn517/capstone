# systemd drop-in for php8.3-fpm (/etc/systemd/system/php8.3-fpm.service.d/hardening.conf).
# Even if the web app were taken over, it could not read /home (SSH keys, browser data,
# the tunnel credentials) or change system files.
[Service]
ProtectHome=yes
PrivateTmp=yes
ProtectSystem=full
NoNewPrivileges=yes
